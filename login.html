<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Casa do Importador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">CASA DO IMPORTADOR</div>
</header>

<section class="section">
    <div class="card">

        <h2>Bem-vindo de volta!</h2>

        <p style="text-align:center; margin-bottom:25px;">
            Entre na sua conta para continuar a aprender.
        </p>

        <form id="loginForm">

            <label for="email">Endereço de e-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite o seu e-mail"
                required
            >

            <label for="password">Palavra-passe</label>
            <input
                type="password"
                id="password"
                placeholder="Digite a sua palavra-passe"
                required
            >

            <button type="submit" class="btn" id="loginButton">
                Entrar na minha conta
            </button>

        </form>

        <p id="mensagem" style="text-align:center; margin-top:15px;"></p>

        <p style="text-align:center; margin-top:20px;">
            Ainda não tem conta?
            <a href="registo.html">Criar conta</a>
        </p>

        <p style="text-align:center; margin-top:15px;">
            <a href="#">Esqueceu a palavra-passe?</a>
        </p>

    </div>
</section>

<footer>
    <p>Casa do Importador © 2026</p>
</footer>

<script type="module">

import { supabase } from './supabase.js';

const formulario = document.getElementById('loginForm');
const mensagem = document.getElementById('mensagem');
const botao = document.getElementById('loginButton');

formulario.addEventListener('submit', async (e) => {

    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    mensagem.textContent = 'A verificar os seus dados...';
    botao.disabled = true;

    try {

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            throw error;
        }

        const { data: perfil, error: erroPerfil } = await supabase
            .from('perfis')
            .select('papel')
            .eq('id', data.user.id)
            .single();

        if (erroPerfil) {
            throw new Error('Não foi possível identificar o perfil da sua conta.');
        }

        mensagem.textContent = 'Login realizado com sucesso!';

        if (
            perfil.papel === 'admin' ||
            perfil.papel === 'administrador'
        ) {
            window.location.href = 'admin.html';
        } else {
            window.location.href = 'aluno.html';
        }

    } catch (error) {

        mensagem.textContent = error.message || 'Não foi possível entrar na sua conta.';
        mensagem.style.color = 'red';

        botao.disabled = false;

    }

});

</script>

</body>
</html>
